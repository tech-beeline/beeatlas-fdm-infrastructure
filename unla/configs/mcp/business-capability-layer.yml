  - name: searchCapabilities
    description: >-
      Поиск TC (технические возможности) и BC (бизнес-возможности) в fdm-search.
      Два режима — выбери один. (1) Код известен: только code, например TC-12345
      или BC-018021; опционально entity_type=tc или bc. (2) Поиск по смыслу:
      query на естественном языке («оплата услуг», «блокировка SIM») + фильтры
      по задаче (см. описания параметров). Ответ: found, results[] с payload
      (code, name, description, entity_type, score).
    method: GET
    endpoint: >-
      {{.Config.url}}/search/api/v1/search?query={{.Args.query}}&code={{.Args.code}}&entity_type={{.Args.entity_type}}&exclude_systems={{.Args.exclude_systems}}&parent={{.Args.parent}}&is_domain={{.Args.is_domain}}&limit={{.Args.limit}}&llm_rerank={{.Args.llm_rerank}}
    headers:
      Authorization: '{{.Request.Headers.Authorization}}'
      Content-Type: application/json
    args:
      - name: query
        position: query
        required: false
        type: string
        description: >-
          Семантический поиск по смыслу, когда кода нет. Формулировка задачи или
          домена своими словами. Пример: «управление тарифами», «блокировка
          абонента». Не передавай вместе с code.
        default: ''
        items:
          type: ''
      - name: code
        position: query
        required: false
        type: string
        description: >-
          Точный поиск, когда код уже известен. Пример: TC-12345, BC-018021.
          Передавай только code; query, parent, exclude_systems, is_domain,
          llm_rerank не нужны.
        default: ''
        items:
          type: ''
      - name: entity_type
        position: query
        required: false
        type: string
        description: >-
          Кого искать: tc — только технические, bc — только бизнес, tc,bc — оба
          (default). С query: bc для бизнес-процессов, tc для IT/систем. С code:
          уточни тип, если известен.
        default: tc,bc
        items:
          type: ''
      - name: exclude_systems
        position: query
        required: false
        type: string
        description: >-
          Только с query и entity_type=tc. Исключить системы из результатов —
          alias или name через запятую. Пример: LegacyCRM,BillingOld. Когда
          пользователь просит не учитывать системы.
        default: ''
        items:
          type: ''
      - name: parent
        position: query
        required: false
        type: string
        description: >-
          Только с query. Сузить поиск до ветки каталога BC — коды родителей
          через запятую (OR). Пример: BC-018021,CATALOG_BC. Когда нужны TC/BC
          только внутри известной бизнес-области.
        default: ''
        items:
          type: ''
      - name: is_domain
        position: query
        required: false
        type: boolean
        description: >-
          Только с query и entity_type=bc. true — только домены BC, false —
          только не-домены. Когда пользователь явно просит домены или
          операционные BC.
        default: 'false'
        items:
          type: ''
      - name: limit
        position: query
        required: false
        type: number
        description: >-
          Только с query. Сколько результатов вернуть (1–100, default 10).
          Увеличь для широкого обзора, уменьши для top-N.
        default: '10'
        items:
          type: int32
    requestBody: ''
    responseBody: '{{.Response.Body}}'
