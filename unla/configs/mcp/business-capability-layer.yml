        required: false
        type: integer
        description: Максимальное число записей в ответе.
        default: ''
        items:
          type: ''
      - name: findBy
        position: query
        required: false
        type: string
        description: 'Режим фильтрации (например: ALL).'
        default: ALL
        items:
          type: ''
      - name: offset
        position: query
