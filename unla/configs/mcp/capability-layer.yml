name: FDM Business Capability Layer
tenant: default
routers:
  - server: fdm-capability
    prefix: /gateway/fdm/capability
    cors:
      allowOrigins:
        - '*'
      allowMethods:
        - GET
        - POST
        - OPTIONS
      allowHeaders:
        - Content-Type
        - Authorization
        - Mcp-Session-Id
        - mcp-protocol-version
      exposeHeaders:
        - Mcp-Session-Id
        - mcp-protocol-version
      allowCredentials: true
servers:
  - name: fdm-capability
    description: >-
      ArchiMate Business Layer — capability-backend. BusinessCapability (БС) и
      TechCapability (ТС): каталоги, деревья, родители и дочерние элементы,
      история версий, карты возможностей, поиск BC/TC, связи ТС с продуктами,
      черновики публикации, справочник критериев оценки BC/TC. Используй для
      модели бизнес- и технических возможностей — не для Customer Journey/BI
      (отдельный MCP cx).
    allowedTools:
      - getCapabilityMapById
      - getTechById
      - getKidsByIdV2
      - getKidsById
      - getById
      - getBusinessCapabilityOrderById
      - getBusinessCapabilityHistory
      - findTechCapabilitiesByProductId
      - getParentsById
      - getBusinessCapabilities
      - getBusinessCapabilityTreeById
      - getBusinessCapabilityOrderDraft
      - getTechCapabilities
      - getAllKidsIdById
      - getBusinessCapabilityHistoryVersion
      - getTechCapabilityHistory
      - searchCapability
      - getParentsById_1
      - getTechCapabilityHistoryVersion
      - getBusinessCapabilityTree
      - getCriteriaList
    config:
      url: http://gateway:8080
tools:
  - name: getCapabilityMapById
    description: Возвращает карту возможностей по идентификатору (id).
    method: GET
    endpoint: '{{.Config.url}}/capability/api/v1/maps/{{.Args.Id}}'
    headers:
      Authorization: '{{.Request.Headers.Authorization}}'
      Content-Type: application/json
    args:
      - name: Id
        position: path
        required: true
        type: number
        description: Идентификатор карты.
        default: ''
        items:
          type: ''
    requestBody: ''
    responseBody: '{{.Response.Body}}'
  - name: getTechById
    description: Возвращает техническую возможность по её id.
    method: GET
    endpoint: '{{.Config.url}}/capability/api/v1/tech-capabilities/{{.Args.id}}'
    headers:
      Authorization: '{{.Request.Headers.Authorization}}'
      Content-Type: application/json
    args:
      - name: id
        position: path
        required: true
        type: number
        description: Идентификатор технической возможности.
        default: ''
        items:
          type: ''
    requestBody: ''
    responseBody: '{{.Response.Body}}'
  - name: getKidsByIdV2
    description: Возвращает дочерние бизнес-возможности для указанной (версия API v2).
    method: GET
    endpoint: >-
      {{.Config.url}}/capability/api/v2/business-capability/{{.Args.id}}/children
    headers:
      Authorization: '{{.Request.Headers.Authorization}}'
      Content-Type: application/json
    args:
      - name: id
        position: path
        required: true
        type: number
        description: Идентификатор бизнес-возможности.
        default: ''
        items:
          type: ''
    requestBody: ''
    responseBody: '{{.Response.Body}}'
  - name: getKidsById
    description: Возвращает список дочерних бизнес-возможностей для указанной.
    method: GET
    endpoint: >-
      {{.Config.url}}/capability/api/v1/business-capability/{{.Args.id}}/children
    headers:
      Authorization: '{{.Request.Headers.Authorization}}'
      Content-Type: application/json
    args:
      - name: id
        position: path
        required: true
        type: number
        description: Идентификатор бизнес-возможности.
        default: ''
        items:
          type: ''
    requestBody: ''
    responseBody: '{{.Response.Body}}'
  - name: getById
    description: Возвращает бизнес-возможность по её id.
    method: GET
    endpoint: '{{.Config.url}}/capability/api/v1/business-capability/{{.Args.id}}'
    headers:
      Authorization: '{{.Request.Headers.Authorization}}'
      Content-Type: application/json
    args:
      - name: id
        position: path
        required: true
        type: number
        description: Идентификатор бизнес-возможности.
        default: ''
        items:
          type: ''
    requestBody: ''
    responseBody: '{{.Response.Body}}'
  - name: getBusinessCapabilityOrderById
    description: Возвращает черновик/заказ публикации по id.
    method: GET
    endpoint: '{{.Config.url}}/capability/api/v1/business-capability/order/{{.Args.id}}'
    headers:
      Authorization: '{{.Request.Headers.Authorization}}'
      Content-Type: application/json
    args:
      - name: id
        position: path
