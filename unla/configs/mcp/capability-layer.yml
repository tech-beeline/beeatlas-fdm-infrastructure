    method: GET
    endpoint: '{{.Config.url}}/capability/api/v1/find'
    headers:
      Authorization: '{{.Request.Headers.Authorization}}'
      Content-Type: application/json
    args:
      - name: findBy
        position: query
        required: false
        type: string
        description: Тип сущности для поиска (по умолчанию ALL).
        default: ALL
        items:
          type: ''
      - name: search
        position: query
        required: true
        type: string
        description: Строка поиска.
        default: ''
        items:
          type: ''
    requestBody: ''
    responseBody: '{{.Response.Body}}'
