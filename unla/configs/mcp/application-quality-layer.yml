name: FDM Application Quality Layer
tenant: default
routers:
  - server: fdm-application-quality
    prefix: /gateway/fdm/application/quality
    cors:
      allowOrigins:
        - '*'
      allowMethods:
        - GET
        - POST
        - OPTIONS
      allowHeaders:
        - Content-Type
        - Authorization
        - Mcp-Session-Id
        - mcp-protocol-version
      exposeHeaders:
        - Mcp-Session-Id
        - mcp-protocol-version
      allowCredentials: true
servers:
  - name: fdm-application-quality
    description: >-
      ArchiMate Application Layer — требования и качество (fdm-products). NFR
      (нефункциональные требования), жизненные ситуации (chapter), паттерны
      Techradar у продукта, фитнес-функции и метрики дашборда. Используй для
      оценки качества, требований и паттернов — не для контейнеров, интерфейсов
      и каталога продуктов.
    allowedTools:
      - getFitnessFunctions
      - getAllNfr
      - getChapterPatterns
      - getChaptersWithNfr
      - getFfAggregation
      - getNfrById
      - getNfrByPatternId
      - getProductsByRequirementId
      - getReqVersionsByCoreId
      - getProductNfr
      - getProductPatterns
      - getSourceMetrics
      - getPatternIdsByProduct
      - getProductFfResults
      - runAllFfByWorkspace
    config:
      url: http://gateway:8080
tools:
  - name: getFitnessFunctions
    description: >-
      Список записей справочника фитнес-функций: код, описание, применимость,
      признак вспомогательной проверки и статус (TEST/TRIAL/ADOPT).
    method: GET
    endpoint: '{{.Config.url}}/ff/api/v1/fitness-functions'
    headers:
      Authorization: '{{.Request.Headers.Authorization}}'
      Content-Type: application/json
    requestBody: ''
    responseBody: '{{.Response.Body}}'
  - name: getAllNfr
    description: Получить все актуальные версии NFR (без дублей по core_id)
    method: GET
    endpoint: '{{.Config.url}}/product/api/v1/nfr'
    headers:
      Authorization: '{{.Request.Headers.Authorization}}'
      Content-Type: application/json
    requestBody: ''
    responseBody: '{{.Response.Body}}'
  - name: getChapterPatterns
    description: >-
      Идентификаторы паттернов для главы (chapter). Список pattern_id из
      Techradar, связанных с жизненной ситуацией.
    method: GET
    endpoint: '{{.Config.url}}/product/api/v1/chapter/{{.Args.id}}/patterns'
    headers:
      Authorization: '{{.Request.Headers.Authorization}}'
      Content-Type: application/json
    args:
      - name: id
        position: path
        required: true
        type: number
        description: Идентификатор главы
        default: ''
        items:
          type: int32
    requestBody: ''
    responseBody: '{{.Response.Body}}'
  - name: getChaptersWithNfr
    description: >-
      Получить жизненные ситуации по NFR: дерево/список chapters, связанных с
      нефункциональными требованиями.
    method: GET
    endpoint: '{{.Config.url}}/product/api/v1/chapter'
    headers:
      Authorization: '{{.Request.Headers.Authorization}}'
      Content-Type: application/json
    requestBody: ''
    responseBody: '{{.Response.Body}}'
  - name: getProductFfResults
    description: >-
      Актуальные результаты фитнес-функций по продукту. Возвращает последние
      проверки (без TEST): по умолчанию основные, при auxiliary=true —
      вспомогательные. Учитывается ветка (по умолчанию main).
    method: GET
    endpoint: '{{.Config.url}}/ff/api/v1/product/{{.Args.code}}/actual-results'
    headers:
      Authorization: '{{.Request.Headers.Authorization}}'
      Content-Type: application/json
    args:
      - name: code
        position: path
        required: true
        type: string
        description: Код (alias) продукта
        default: ''
        items:
          type: string
      - name: auxiliary
        position: query
        required: false
        type: boolean
        description: >-
          true — только вспомогательные проверки (auxiliary_check); иначе только
          основные. TEST не включается.
        default: ''
        items:
          type: boolean
      - name: branch
        position: query
        required: false
        type: string
        description: 'Ветка результата (по умолчанию main)'
        default: ''
        items:
          type: string
    requestBody: ''
    responseBody: '{{.Response.Body}}'
  - name: getFfAggregation
    description: >-
      Сводка фитнес-функций для дашборда: список функций и дерево
      домены → продукты с актуальными результатами проверок.
    method: GET
    endpoint: '{{.Config.url}}/ff/api/v1/dashboard/fitness-function'
    headers:
      Authorization: '{{.Request.Headers.Authorization}}'
      Content-Type: application/json
    requestBody: ''
    responseBody: '{{.Response.Body}}'
  - name: runAllFfByWorkspace
    description: >-
      «Сухой» прогон всех фитнес-функций по продукту на переданном
      workspace.json (Structurizr): считает проверки TRIAL/ADOPT и возвращает
      результаты без сохранения в БД. Асинхронные проверки пропускаются.
    method: POST
    endpoint: '{{.Config.url}}/ff/api/v1/run-all-workspace'
    headers:
      Authorization: '{{.Request.Headers.Authorization}}'
      Content-Type: application/json
    args:
      - name: app
        position: query
        required: true
        type: string
        description: Alias (мнемоника) продукта
        default: ''
        items:
          type: string
      - name: branch
        position: query
        required: false
        type: string
        description: 'Ветка (по умолчанию main)'
        default: ''
        items:
          type: string
      - name: workspace
        position: body
        required: true
        type: object
        description: JSON-документ workspace (Structurizr)
        default: '{}'
    requestBody: |-
      {{ toJSON .Args.workspace }}
    responseBody: '{{.Response.Body}}'
  - name: getNfrById
    description: Получить NFR по id (конкретную версию)
    method: GET
    endpoint: '{{.Config.url}}/product/api/v1/nfr/{{.Args.id}}'
    headers:
      Authorization: '{{.Request.Headers.Authorization}}'
      Content-Type: application/json
    args:
      - name: id
        position: path
        required: true
        type: integer
        description: Идентификатор NFR
        default: ''
        items:
          type: int32
    requestBody: ''
    responseBody: '{{.Response.Body}}'
  - name: getNfrByPatternId
    description: Список NFR, связанных с паттерном Techradar
    method: GET
    endpoint: '{{.Config.url}}/product/api/v1/requirement/pattern/{{.Args.id}}'
    headers:
      Authorization: '{{.Request.Headers.Authorization}}'
      Content-Type: application/json
    args:
      - name: id
        position: path
        required: true
        type: integer
        description: Идентификатор паттерна
        default: ''
        items:
          type: int32
    requestBody: ''
    responseBody: '{{.Response.Body}}'
  - name: getProductsByRequirementId
    description: >-
      Продукты, которым назначена версия требования NFR. filter: all (по
      умолчанию), auto (Beeatlas), hand (ручное назначение).
    method: GET
    endpoint: '{{.Config.url}}/product/api/v1/requirement/{{.Args.id}}/products'
    headers:
      Authorization: '{{.Request.Headers.Authorization}}'
      Content-Type: application/json
    args:
      - name: id
        position: path
        required: true
        type: string
        description: Идентификатор версии требования
        default: ''
        items:
          type: ''
      - name: filter
        position: query
        required: false
        type: string
        description: 'Фильтр по способу назначения: all | auto | hand'
        default: all
        items:
          type: ''
    requestBody: ''
    responseBody: '{{.Response.Body}}'
  - name: getReqVersionsByCoreId
    description: >-
      История версий требования NFR по core-id. Все версии, отсортированные по
      номеру версии по возрастанию.
    method: GET
    endpoint: '{{.Config.url}}/product/api/v1/requirement/core/{{.Args.core-id}}/versions'
    headers:
      Authorization: '{{.Request.Headers.Authorization}}'
      Content-Type: application/json
    args:
      - name: core-id
        position: path
        required: true
        type: string
        description: Идентификатор основы требования (core_id)
        default: ''
        items:
          type: ''
    requestBody: ''
    responseBody: '{{.Response.Body}}'
  - name: getProductNfr
    description: Получить все актуальные версии требований NFR, связанные с продуктом
    method: GET
    endpoint: '{{.Config.url}}/product/api/v1/nfr/product'
    headers:
      Authorization: '{{.Request.Headers.Authorization}}'
      Content-Type: application/json
    args:
      - name: id
        position: query
        required: false
        type: number
        description: ''
        default: ''
        items:
          type: int32
      - name: alias
        position: query
        required: false
        type: string
        description: ''
        default: ''
        items:
          type: ''
      - name: api-key
        position: query
        required: false
        type: string
        description: ''
        default: ''
        items:
          type: ''
    requestBody: ''
    responseBody: '{{.Response.Body}}'
  - name: getProductPatterns
    description: >-
      Паттерны Techradar, связанные с продуктом (опциональная фильтрация по
      источнику)
    method: GET
    endpoint: '{{.Config.url}}/product/api/v1/product/{{.Args.alias}}/patterns'
    headers:
      Authorization: '{{.Request.Headers.Authorization}}'
      Content-Type: application/json
    args:
      - name: alias
        position: path
        required: false
        type: string
        description: Alias продукта
        default: ''
        items:
          type: string
      - name: source-id
        position: query
        required: false
        type: integer
        description: Идентификатор источника (опционально)
        default: ''
        items:
          type: int32
      - name: source-type
        position: query
        required: false
        type: string
        description: Тип источника (опционально)
        default: ''
        items:
          type: string
    requestBody: ''
    responseBody: '{{.Response.Body}}'
  - name: getSourceMetrics
    description: >-
      Получить метрики источников. Возвращает агрегированный объект метрик (поля
      DTO), а не массив отдельных записей.
    method: GET
    endpoint: '{{.Config.url}}/product/api/v1/source-metric'
    headers:
      Authorization: '{{.Request.Headers.Authorization}}'
      Content-Type: application/json
    requestBody: ''
    responseBody: '{{.Response.Body}}'
  - name: getPatternIdsByProduct
    description: >-
      Идентификаторы паттернов по продукту (ровно один из параметров id, alias
      или api-key обязателен. Пустой массив — если у продукта нет подходящих NFR
      или паттернов)
    method: GET
    endpoint: '{{.Config.url}}/product/api/v1/pattern/product'
    headers:
      Authorization: '{{.Request.Headers.Authorization}}'
      Content-Type: application/json
    args:
      - name: id
        position: query
        required: false
        type: integer
        description: Числовой ID продукта
        default: ''
        items:
          type: int32
      - name: alias
        position: query
        required: false
        type: string
        description: Alias (код) продукта
        default: ''
        items:
          type: string
      - name: api-key
        position: query
        required: false
        type: string
        description: API-ключ продукта для идентификации
        default: ''
        items:
          type: string
    requestBody: ''
    responseBody: '{{.Response.Body}}'
prompts: []
mcpServers: []
